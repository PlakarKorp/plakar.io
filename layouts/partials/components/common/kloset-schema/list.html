<div class="flex flex-col rounded-lg overflow-hidden bg-ui-neutral-50">
  <div class="flex items-center justify-center h-12 md:h-16 px-2 border-b border-ui-neutral-200">
    <h4 class="text-sm md:text-lg font-bold leading-tight text-center text-ui-neutral-900">{{ .title }}</h4>
  </div>
  <div class="flex-1 flex flex-col p-2 md:p-3">
    {{ range .items }}
      <div class="flex items-center gap-3 px-1 py-2 border-b border-ui-neutral-200">
        <span class="block w-4 h-4 md:w-5 md:h-5 shrink-0 text-ui-neutral-800">{{ partial "icon.html" .icon }}</span>
        <span class="text-xs md:text-sm font-medium leading-tight text-ui-neutral-600">{{ .label }}</span>
      </div>
    {{ end }}
    <div class="py-2 text-center text-xs md:text-sm font-bold text-ui-neutral-400">...</div>
  </div>
</div>
