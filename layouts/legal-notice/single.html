{{ define "main" }}

<section class="section-light-2 grid-background pt-46">
  <div class="bg-gradient-section-light-1">
    <div class="px-4 pt-20 pb-7 max-w-350 mx-auto">
      <div class="text-base max-w-prose">
        <h1 class="text-4xl lg:text-6xl">{{ .Title }}</h1>
      </div>
    </div>
  </div>
</section>

<section class="px-4 pt-28 mb-44 max-w-350 mx-auto">
  {{/* `wide: true` in front matter: full container width, justified text. */}}
  <article lang="en" class="legal-document prose {{ if .Params.wide }}legal-wide{{ else }}max-w-prose{{ end }}">
    {{ .Content | safeHTML }}
  </article>
</section>

{{ end }}
