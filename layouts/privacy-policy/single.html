{{ define "main" }}

<section class="section-light-2 grid-background pt-46">
  <div class="bg-gradient-section-light-1">
    <div class="px-4 pt-20 pb-7 max-w-350 mx-auto">
      <h1 class="text-4xl lg:text-6xl">Privacy Policy</h1>
      <a href="/terms/" class="inline-flex items-center gap-1 mt-4 text-sm font-medium text-neutral-600 hover:text-neutral-900 hover:underline">
        <span class="w-4 h-4">{{ partial "icon.html" "ri/arrow-left-line" }}</span>
        Back to all terms
      </a>
    </div>
  </div>
</section>

<section class="px-4 pt-28 mb-44 max-w-350 mx-auto">
  <article class="prose dark:prose-invert max-w-prose">
    {{ .Content | safeHTML }}
  </article>
</section>

{{ end }}
