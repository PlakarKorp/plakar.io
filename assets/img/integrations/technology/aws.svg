<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 460" role="img" aria-label="An AWS account holds six resources. The backup plan covers the three created first. The Plakar inventory covers all six, including a bucket created from the console, an RDS instance created by a coding agent and an Aurora cluster created by Terraform." font-family="Inter, system-ui, sans-serif" class="w-full h-auto">
  <text x="20" y="26" font-size="15" font-weight="600" fill="rgb(28,28,30)">AWS account</text>
  <rect x="20" y="40" width="280" height="400" rx="14" fill="#fff" stroke="rgb(231,230,240)" stroke-width="2"/>
  <g>
    <rect x="40" y="62" width="240" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <rect x="40" y="122" width="240" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <rect x="40" y="182" width="240" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <rect x="40" y="252" width="240" height="46" rx="8" fill="rgb(218,217,255)"/>
    <rect x="40" y="312" width="240" height="46" rx="8" fill="rgb(218,217,255)"/>
    <rect x="40" y="372" width="240" height="46" rx="8" fill="rgb(218,217,255)"/>
  </g>
  <g font-size="12" font-weight="600" fill="rgb(79,78,102)">
    <text x="56" y="89">S3</text>
    <text x="56" y="149">RDS</text>
    <text x="56" y="209">RDS</text>
  </g>
  <g font-size="12" font-weight="600" fill="rgb(82,76,255)">
    <text x="56" y="279">S3</text>
    <text x="56" y="339">RDS</text>
    <text x="56" y="399">Aurora</text>
  </g>
  <g font-size="14" font-weight="500">
    <text x="108" y="90" fill="rgb(79,78,102)">app-uploads</text>
    <text x="108" y="150" fill="rgb(79,78,102)">orders</text>
    <text x="108" y="210" fill="rgb(79,78,102)">billing</text>
    <text x="108" y="280" fill="rgb(82,76,255)">acme-ml-features-eu</text>
    <text x="108" y="340" fill="rgb(82,76,255)">orders-preview</text>
    <text x="108" y="400" fill="rgb(82,76,255)">analytics</text>
  </g>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M314 62 H324 V228 H314" stroke="rgb(79,78,102)"/>
    <path d="M404 62 H414 V418 H404" stroke="rgb(82,76,255)"/>
  </g>
  <g font-size="15" font-weight="600">
    <text x="332" y="140" fill="rgb(79,78,102)">Backup</text>
    <text x="332" y="158" fill="rgb(79,78,102)">plan</text>
    <text x="422" y="245" fill="rgb(82,76,255)">Plakar</text>
  </g>
</svg>
