<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="An updateMany with the wrong filter on the MongoDB primary is applied by both secondaries. The oplog is capped by size, so its oldest entries are overwritten by new writes. Nightly Plakar snapshots of mongodump output, kept outside the replica set, still hold the orders collection." font-family="Inter, system-ui, sans-serif" class="w-full h-auto">
  <defs>
    <marker id="mongo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="rgb(79,78,102)"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="600" fill="rgb(28,28,30)">MongoDB replica set</text>
  <rect x="20" y="40" width="390" height="236" rx="14" fill="#fff" stroke="rgb(231,230,240)" stroke-width="2"/>

  <g font-size="15" font-weight="600" fill="rgb(79,78,102)">
    <rect x="36" y="60" width="106" height="80" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="48" y="88">Primary</text>
    <rect x="162" y="60" width="106" height="80" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="174" y="88">Secondary</text>
    <rect x="288" y="60" width="106" height="80" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="300" y="88">Secondary</text>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="rgb(79,78,102)">
    <text x="48" y="118">updateMany</text>
    <text x="174" y="118">updateMany</text>
    <text x="300" y="118">updateMany</text>
  </g>
  <g fill="none" stroke="rgb(79,78,102)" stroke-width="2" stroke-linecap="round">
    <path d="M142 100 H160" marker-end="url(#mongo-arrow)"/>
    <path d="M268 100 H286" marker-end="url(#mongo-arrow)"/>
  </g>

  <text x="36" y="180" font-size="15" font-weight="600" fill="rgb(79,78,102)">Oplog, capped by size</text>
  <g fill="none" stroke="rgb(160,159,180)" stroke-width="1.5" stroke-dasharray="4 4">
    <rect x="36" y="194" width="30" height="34" rx="4"/>
    <rect x="72" y="194" width="30" height="34" rx="4"/>
    <rect x="108" y="194" width="30" height="34" rx="4"/>
  </g>
  <g fill="rgb(245,244,251)" stroke="rgb(231,230,240)">
    <rect x="144" y="194" width="30" height="34" rx="4"/>
    <rect x="180" y="194" width="30" height="34" rx="4"/>
    <rect x="216" y="194" width="30" height="34" rx="4"/>
    <rect x="252" y="194" width="30" height="34" rx="4"/>
    <rect x="288" y="194" width="30" height="34" rx="4"/>
    <rect x="324" y="194" width="30" height="34" rx="4"/>
    <rect x="360" y="194" width="34" height="34" rx="4" fill="rgb(79,78,102)" stroke="none"/>
  </g>
  <g font-size="12" font-weight="500">
    <text x="36" y="252" fill="rgb(160,159,180)">oldest entries overwritten</text>
    <text x="394" y="252" text-anchor="end" fill="rgb(79,78,102)">newest</text>
  </g>

  <text x="20" y="316" font-size="15" font-weight="600" fill="rgb(82,76,255)">Plakar</text>
  <g fill="rgb(218,217,255)">
    <rect x="20" y="330" width="84" height="100" rx="8"/>
    <rect x="122" y="330" width="84" height="100" rx="8"/>
    <rect x="224" y="330" width="84" height="100" rx="8"/>
    <rect x="326" y="330" width="84" height="100" rx="8"/>
  </g>
  <g font-size="15" font-weight="600" fill="rgb(82,76,255)">
    <text x="32" y="364">Mon</text>
    <text x="134" y="364">Tue</text>
    <text x="236" y="364">Wed</text>
    <text x="338" y="364">Thu</text>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="rgb(82,76,255)">
    <text x="32" y="400">orders</text>
    <text x="134" y="400">orders</text>
    <text x="236" y="400">orders</text>
    <text x="338" y="400">orders</text>
  </g>
</svg>
