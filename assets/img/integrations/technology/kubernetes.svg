<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="A Kubernetes cluster holds Deployments, Services, ConfigMaps, Secrets, operator-created objects and PVC data. Git holds the first three, a Plakar snapshot holds all six." font-family="Inter, system-ui, sans-serif" class="w-full h-auto">
  <text x="20" y="26" font-size="15" font-weight="600" fill="rgb(28,28,30)">Kubernetes cluster</text>
  <rect x="20" y="40" width="250" height="400" rx="14" fill="#fff" stroke="rgb(231,230,240)" stroke-width="2"/>
  <g font-size="15" font-weight="500">
    <rect x="40" y="62" width="210" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="58" y="90" fill="rgb(79,78,102)">Deployments</text>
    <rect x="40" y="122" width="210" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="58" y="150" fill="rgb(79,78,102)">Services</text>
    <rect x="40" y="182" width="210" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="58" y="210" fill="rgb(79,78,102)">ConfigMaps</text>
    <rect x="40" y="252" width="210" height="46" rx="8" fill="rgb(218,217,255)"/>
    <text x="58" y="280" fill="rgb(82,76,255)">Secrets</text>
    <rect x="40" y="312" width="210" height="46" rx="8" fill="rgb(218,217,255)"/>
    <text x="58" y="340" fill="rgb(82,76,255)">Operator objects</text>
    <rect x="40" y="372" width="210" height="46" rx="8" fill="rgb(218,217,255)"/>
    <text x="58" y="400" fill="rgb(82,76,255)">PVC data</text>
  </g>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M284 62 H294 V228 H284" stroke="rgb(79,78,102)"/>
    <path d="M334 62 H344 V418 H334" stroke="rgb(82,76,255)"/>
  </g>
  <g font-size="15" font-weight="600">
    <text x="302" y="150" fill="rgb(79,78,102)">Git</text>
    <text x="352" y="245" fill="rgb(82,76,255)">Plakar</text>
  </g>
</svg>
