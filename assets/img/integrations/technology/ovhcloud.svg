<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="An OVHcloud account holds several Public Cloud projects with instances and Cinder volumes. One Plakar inventory lists the instances of every project. Plakar keeps an encrypted history of each instance with its volumes in a store you choose, and restores it as a new instance in the same region, in another region, or with no network for an investigation." font-family="Inter, system-ui, sans-serif" class="w-full h-auto">
  <defs>
    <marker id="ovh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="rgb(82,76,255)"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="600" fill="rgb(28,28,30)">OVHcloud account</text>
  <rect x="20" y="40" width="210" height="400" rx="14" fill="#fff" stroke="rgb(231,230,240)" stroke-width="2"/>

  <text x="38" y="66" font-size="13" font-weight="600" fill="rgb(79,78,102)">Project prod · GRA11</text>
  <g font-size="15" font-weight="500" fill="rgb(79,78,102)">
    <rect x="38" y="78" width="174" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="54" y="106">Instance</text>
    <rect x="38" y="134" width="174" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="54" y="162">Cinder volumes</text>
  </g>

  <text x="38" y="216" font-size="13" font-weight="600" fill="rgb(79,78,102)">Project staging · SBG5</text>
  <rect x="38" y="228" width="174" height="46" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
  <text x="54" y="256" font-size="15" font-weight="500" fill="rgb(79,78,102)">Instances</text>

  <line x1="38" y1="298" x2="212" y2="298" stroke="rgb(231,230,240)" stroke-width="2"/>
  <rect x="38" y="316" width="174" height="104" rx="8" fill="rgb(218,217,255)"/>
  <text x="54" y="344" font-size="15" font-weight="600" fill="rgb(82,76,255)">Plakar inventory</text>
  <g font-size="13" fill="rgb(79,78,102)">
    <text x="54" y="370">lists the instances</text>
    <text x="54" y="390">of every project</text>
  </g>

  <text x="254" y="26" font-size="15" font-weight="600" fill="rgb(82,76,255)">Plakar</text>
  <path d="M212 129 H246" fill="none" stroke="rgb(82,76,255)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#ovh-arrow)"/>
  <rect x="254" y="62" width="156" height="178" rx="8" fill="rgb(218,217,255)"/>
  <text x="268" y="90" font-size="15" font-weight="600" fill="rgb(82,76,255)">Your store</text>
  <g fill="rgb(82,76,255)">
    <rect x="268" y="106" width="128" height="18" rx="4"/>
    <rect x="268" y="132" width="128" height="18" rx="4"/>
    <rect x="268" y="158" width="128" height="18" rx="4"/>
    <rect x="268" y="184" width="128" height="18" rx="4"/>
    <rect x="268" y="210" width="128" height="18" rx="4" opacity="0.5"/>
  </g>

  <path d="M266 240 V408" fill="none" stroke="rgb(82,76,255)" stroke-width="2" stroke-linecap="round"/>
  <g fill="none" stroke="rgb(82,76,255)" stroke-width="2" stroke-linecap="round">
    <path d="M266 290 H278" marker-end="url(#ovh-arrow)"/>
    <path d="M266 349 H278" marker-end="url(#ovh-arrow)"/>
    <path d="M266 408 H278" marker-end="url(#ovh-arrow)"/>
  </g>
  <text x="280" y="258" font-size="13" font-weight="500" fill="rgb(82,76,255)">new instance</text>
  <g fill="#fff" stroke="rgb(82,76,255)" stroke-width="1.5">
    <rect x="284" y="270" width="126" height="40" rx="8"/>
    <rect x="284" y="329" width="126" height="40" rx="8"/>
    <rect x="284" y="388" width="126" height="40" rx="8"/>
  </g>
  <g font-size="14" font-weight="600" fill="rgb(82,76,255)">
    <text x="298" y="295">Same region</text>
    <text x="298" y="354">Other region</text>
    <text x="298" y="413">No network</text>
  </g>
</svg>
