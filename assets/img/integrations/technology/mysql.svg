<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="A timeline of the last 70 days. The MySQL binary log keeps the last 30 days and older events are purged, so a DROP TABLE orders run 45 days ago has nothing left to replay. Weekly Plakar snapshots cover the whole period, and those taken before the drop still hold the orders table." font-family="Inter, system-ui, sans-serif" class="w-full h-auto">
  <text x="110" y="26" font-size="15" font-weight="600" fill="rgb(28,28,30)">Binary log</text>
  <text x="270" y="26" font-size="15" font-weight="600" fill="rgb(82,76,255)">Plakar</text>

  <g font-size="13" font-weight="500" fill="rgb(79,78,102)">
    <text x="20" y="60">today</text>
    <text x="20" y="220">30 days</text>
    <text x="20" y="380">60 days</text>
  </g>
  <g stroke="rgb(231,230,240)" stroke-width="1">
    <line x1="20" y1="66" x2="96" y2="66"/>
    <line x1="20" y1="226" x2="96" y2="226"/>
    <line x1="20" y1="386" x2="96" y2="386"/>
  </g>

  <rect x="110" y="48" width="130" height="168" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
  <text x="124" y="80" font-size="15" font-weight="600" fill="rgb(79,78,102)">Kept</text>
  <text x="124" y="102" font-size="13" fill="rgb(79,78,102)">replayable</text>

  <rect x="110" y="226" width="130" height="212" rx="8" fill="none" stroke="rgb(160,159,180)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="124" y="414" font-size="15" font-weight="600" fill="rgb(160,159,180)">Purged</text>

  <line x1="20" y1="296" x2="410" y2="296" stroke="rgb(79,78,102)" stroke-width="2" stroke-linecap="round"/>
  <text x="20" y="288" font-size="13" font-weight="500" fill="rgb(79,78,102)">45 days</text>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="rgb(79,78,102)">
    <text x="124" y="318">DROP TABLE</text>
    <text x="124" y="336">orders;</text>
  </g>

  <g fill="rgb(218,217,255)">
    <rect x="270" y="48" width="140" height="22" rx="5"/>
    <rect x="270" y="85" width="140" height="22" rx="5"/>
    <rect x="270" y="122" width="140" height="22" rx="5"/>
    <rect x="270" y="160" width="140" height="22" rx="5"/>
    <rect x="270" y="197" width="140" height="22" rx="5"/>
    <rect x="270" y="234" width="140" height="22" rx="5"/>
    <rect x="270" y="271" width="140" height="22" rx="5"/>
  </g>
  <g fill="rgb(82,76,255)">
    <rect x="270" y="326" width="140" height="22" rx="5"/>
    <rect x="270" y="363" width="140" height="22" rx="5"/>
    <rect x="270" y="400" width="140" height="22" rx="5"/>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#fff">
    <text x="282" y="342">orders</text>
    <text x="282" y="379">orders</text>
    <text x="282" y="416">orders</text>
  </g>
</svg>
