<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="A Scaleway project holds Instances, Block Storage volumes, Secret Manager secrets and the snapshots that roll them back inside that project. Plakar keeps an encrypted history of the Instances, volumes and secrets in a store you choose, and restores it as new resources in the same project, another project or another zone." font-family="Inter, system-ui, sans-serif" class="w-full h-auto">
  <defs>
    <marker id="scw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="rgb(82,76,255)"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="600" fill="rgb(28,28,30)">Scaleway project</text>
  <rect x="20" y="40" width="210" height="400" rx="14" fill="#fff" stroke="rgb(231,230,240)" stroke-width="2"/>

  <g font-size="15" font-weight="500" fill="rgb(79,78,102)">
    <rect x="38" y="62" width="174" height="50" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="54" y="92">Instances</text>
    <rect x="38" y="126" width="174" height="50" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="54" y="156">Block volumes</text>
    <rect x="38" y="190" width="174" height="50" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="54" y="220">Secrets</text>
  </g>

  <line x1="38" y1="270" x2="212" y2="270" stroke="rgb(231,230,240)" stroke-width="2"/>
  <rect x="38" y="292" width="174" height="128" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
  <text x="54" y="322" font-size="15" font-weight="600" fill="rgb(79,78,102)">Native snapshots</text>
  <g font-size="13" fill="rgb(79,78,102)">
    <text x="54" y="350">roll back inside</text>
    <text x="54" y="370">this project</text>
  </g>

  <text x="254" y="26" font-size="15" font-weight="600" fill="rgb(82,76,255)">Plakar</text>
  <path d="M212 151 H246" fill="none" stroke="rgb(82,76,255)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#scw-arrow)"/>
  <rect x="254" y="62" width="156" height="178" rx="8" fill="rgb(218,217,255)"/>
  <text x="268" y="90" font-size="15" font-weight="600" fill="rgb(82,76,255)">Your store</text>
  <g fill="rgb(82,76,255)">
    <rect x="268" y="106" width="128" height="18" rx="4"/>
    <rect x="268" y="132" width="128" height="18" rx="4"/>
    <rect x="268" y="158" width="128" height="18" rx="4"/>
    <rect x="268" y="184" width="128" height="18" rx="4"/>
    <rect x="268" y="210" width="128" height="18" rx="4" opacity="0.5"/>
  </g>

  <path d="M266 240 V408" fill="none" stroke="rgb(82,76,255)" stroke-width="2" stroke-linecap="round"/>
  <g fill="none" stroke="rgb(82,76,255)" stroke-width="2" stroke-linecap="round">
    <path d="M266 290 H278" marker-end="url(#scw-arrow)"/>
    <path d="M266 349 H278" marker-end="url(#scw-arrow)"/>
    <path d="M266 408 H278" marker-end="url(#scw-arrow)"/>
  </g>
  <text x="280" y="258" font-size="13" font-weight="500" fill="rgb(82,76,255)">restore as new</text>
  <g fill="#fff" stroke="rgb(82,76,255)" stroke-width="1.5">
    <rect x="284" y="270" width="126" height="40" rx="8"/>
    <rect x="284" y="329" width="126" height="40" rx="8"/>
    <rect x="284" y="388" width="126" height="40" rx="8"/>
  </g>
  <g font-size="14" font-weight="600" fill="rgb(82,76,255)">
    <text x="298" y="295">Same project</text>
    <text x="298" y="354">Other project</text>
    <text x="298" y="413">Other zone</text>
  </g>
</svg>
