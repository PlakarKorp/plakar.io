<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="Inside one cloud account, the bucket, its versions, Object Lock and replication are all managed by the same users and keys. Plakar reads the bucket and keeps its snapshots in a store with its own credentials, at another provider or on premises." font-family="Inter, system-ui, sans-serif" class="w-full h-auto">
  <defs>
    <marker id="s3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="rgb(82,76,255)"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="600" fill="rgb(28,28,30)">Cloud account</text>
  <rect x="20" y="40" width="226" height="400" rx="14" fill="#fff" stroke="rgb(231,230,240)" stroke-width="2"/>

  <g font-size="15" font-weight="500" fill="rgb(79,78,102)">
    <rect x="40" y="62" width="186" height="50" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="58" y="92">Bucket</text>
    <rect x="40" y="126" width="186" height="50" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="58" y="156">Versioning</text>
    <rect x="40" y="190" width="186" height="50" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="58" y="220">Object Lock</text>
    <rect x="40" y="254" width="186" height="50" rx="8" fill="rgb(245,244,251)" stroke="rgb(231,230,240)"/>
    <text x="58" y="284">Replication</text>
  </g>

  <rect x="40" y="350" width="186" height="70" rx="8" fill="rgb(79,78,102)"/>
  <g font-size="14" font-weight="600" fill="#fff">
    <text x="58" y="380">Same users</text>
    <text x="58" y="402">and keys</text>
  </g>
  <path d="M133 304 V346" fill="none" stroke="rgb(79,78,102)" stroke-width="2" stroke-dasharray="3 4"/>

  <text x="270" y="26" font-size="15" font-weight="600" fill="rgb(82,76,255)">Plakar store</text>
  <rect x="270" y="40" width="140" height="400" rx="14" fill="#fff" stroke="rgb(82,76,255)" stroke-width="2"/>
  <path d="M226 87 H282" fill="none" stroke="rgb(82,76,255)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#s3-arrow)"/>

  <g fill="rgb(218,217,255)">
    <rect x="286" y="62" width="108" height="50" rx="8"/>
    <rect x="286" y="126" width="108" height="50" rx="8"/>
    <rect x="286" y="190" width="108" height="50" rx="8"/>
    <rect x="286" y="254" width="108" height="50" rx="8"/>
  </g>
  <g font-size="15" font-weight="600" fill="rgb(82,76,255)">
    <text x="300" y="92">Snapshot</text>
    <text x="300" y="156">Snapshot</text>
    <text x="300" y="220">Snapshot</text>
    <text x="300" y="284">Snapshot</text>
  </g>

  <rect x="286" y="350" width="108" height="70" rx="8" fill="rgb(82,76,255)"/>
  <g font-size="14" font-weight="600" fill="#fff">
    <text x="300" y="380">Its own</text>
    <text x="300" y="402">credentials</text>
  </g>
</svg>
