<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="Illustration: three nightly tar czf archives, each a full copy of the directory tree. The same three nights in a Plakar store: the first night stores the whole tree, the next two store only the new chunks." font-family="Inter, system-ui, sans-serif" class="w-full h-auto">
  <text x="20" y="26" font-size="15" font-weight="600" fill="rgb(28,28,30)">Nightly tar czf</text>
  <rect x="20" y="40" width="390" height="176" rx="14" fill="#fff" stroke="rgb(231,230,240)" stroke-width="2"/>

  <g font-size="14" font-weight="600" fill="rgb(79,78,102)">
    <text x="38" y="84">Mon</text>
    <text x="38" y="134">Tue</text>
    <text x="38" y="184">Wed</text>
  </g>
  <g fill="rgb(245,244,251)" stroke="rgb(231,230,240)">
    <rect x="84" y="60" width="306" height="36" rx="6"/>
    <rect x="84" y="110" width="306" height="36" rx="6"/>
    <rect x="84" y="160" width="306" height="36" rx="6"/>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="rgb(79,78,102)">
    <text x="98" y="83">full copy</text>
    <text x="98" y="133">full copy</text>
    <text x="98" y="183">full copy</text>
  </g>

  <text x="20" y="266" font-size="15" font-weight="600" fill="rgb(82,76,255)">Plakar store</text>
  <rect x="20" y="280" width="390" height="160" rx="14" fill="#fff" stroke="rgb(82,76,255)" stroke-width="2"/>

  <g font-size="14" font-weight="600" fill="rgb(82,76,255)">
    <text x="38" y="324">Mon</text>
    <text x="38" y="374">Tue</text>
    <text x="38" y="424">Wed</text>
  </g>
  <rect x="84" y="300" width="306" height="36" rx="6" fill="rgb(218,217,255)"/>
  <g fill="rgb(82,76,255)">
    <rect x="84" y="350" width="22" height="36" rx="6"/>
    <rect x="84" y="400" width="16" height="36" rx="6"/>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="rgb(82,76,255)">
    <text x="98" y="323">whole tree</text>
    <text x="118" y="373">new chunks</text>
    <text x="112" y="423">new chunks</text>
  </g>
</svg>
