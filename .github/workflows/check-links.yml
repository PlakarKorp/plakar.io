name: Check Links

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-links-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Install Blowfish dependencies
        run: npm install
        working-directory: themes/blowfish

      - name: Install root dependencies
        run: npm ci

      - name: Cache Hugo resources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: resources/_gen
          key: hugo-resources-v1-${{ github.ref_name }}-${{ hashFiles('assets/**', 'content/**', 'layouts/**') }}
          restore-keys: |
            hugo-resources-v1-${{ github.ref_name }}-
            hugo-resources-v1-

      - name: Build site
        run: npm run build

      - name: Check internal links
        run: node scripts/check-links.mjs public
