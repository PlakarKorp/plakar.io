name: Publish Preview

# Staging deploy. Mirrors publish-site.yml, with two differences:
#
#   HUGO_ENVIRONMENT: preview  loads config/preview/ on top of config/_default/,
#                              which sets baseURL to stg.plakar.io, marks the
#                              site noindex, and makes hugo.IsProduction false
#                              so Google Tag Manager stays off
#   publish_branch             gh-pages-preview rather than the action's default
#                              of gh-pages, which is production
on:
  push:
    branches:
      - preview

permissions:
  contents: write

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Install Blowfish dependencies
        run: npm install
        working-directory: themes/blowfish

      - name: Install root dependencies
        run: npm ci

      - name: Cache Hugo resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/_gen
          key: hugo-resources-v1-${{ github.ref_name }}-${{ hashFiles('assets/**', 'content/**', 'layouts/**') }}
          restore-keys: |
            hugo-resources-v1-${{ github.ref_name }}-
            hugo-resources-v1-

      - name: Build site
        run: npm run build
        env:
          HUGO_ENVIRONMENT: preview

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages-preview
