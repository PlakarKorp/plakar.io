name: Publish Preview

# Staging deploy. Mirrors publish-site.yml, with two differences:
#
#   HUGO_ENVIRONMENT: preview  loads config/preview/ on top of config/_default/,
#                              which sets baseURL to stg.plakar.io, marks the
#                              site noindex, and makes hugo.IsProduction false
#                              so Google Tag Manager stays off
#   publish_branch             gh-pages-preview rather than the action's default
#                              of gh-pages, which is production
on:
  push:
    branches:
      - preview

permissions:
  contents: write

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Install Blowfish dependencies
        run: npm install
        working-directory: themes/blowfish

      - name: Install root dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          HUGO_ENVIRONMENT: preview

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages-preview
