name: Publish Site

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Install Blowfish dependencies
        run: npm install
        working-directory: themes/blowfish

      - name: Install root dependencies
        run: npm ci

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-v1-${{ github.ref_name }}-${{ hashFiles('assets/**', 'content/**', 'layouts/**') }}
          restore-keys: |
            hugo-resources-v1-${{ github.ref_name }}-
            hugo-resources-v1-

      - name: Build site
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Stated explicitly rather than relying on the action's default, so
          # this cannot be confused with publish-preview.yml's target.
          publish_branch: gh-pages
